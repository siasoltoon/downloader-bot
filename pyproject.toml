[project]
name = "downloader-bot"
version = "1.0.0"
description = "Telegram media downloader powered by yt-dlp and S3-compatible storage"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot[job-queue]>=22,<23",
  "yt-dlp>=2026.8.0",
  "boto3>=1.40,<2",
  "aiosqlite>=0.21,<1",
  "pydantic-settings>=2.10,<3",
]

[project.scripts]
downloader-bot = "app.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

enable = true
